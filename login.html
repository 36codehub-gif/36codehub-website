<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup - 36CodeHub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #121212; color: #fff; padding: 20px; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 12px; width: 100%; max-width: 350px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 20px; color: #4F46E5; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #333; border-radius: 6px; background: #2a2a2a; color: #fff; outline: none; }
        button { width: 100%; padding: 12px; background: #4F46E5; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-signup { background: transparent; border: 1px solid #4F46E5; }
    </style>
</head>
<body>

<div class="card">
    <h2>Welcome Back</h2>
    <input type="email" id="email" placeholder="Email Address">
    <input type="password" id="password" placeholder="Password">
    
    <button onclick="login()">Login</button>
    <button class="btn-signup" onclick="signup()">Sign Up</button>
</div>

<!-- Supabase Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // Supabase Connect
  const SUPABASE_URL = 'https://suhjihyxyqoordyitcuv.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_MJ3gmyPme6nCjR_XGt3jHA_MfOIZUJb';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Login Function
  async function login() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    if(!email || !password) return alert("Email aur Password bharein!");

    const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

    if (error) {
      alert("Error: " + error.message);
    } else {
      alert("Login Successful!");
      window.location.href = "index.html"; // Home page par bhejne ke liye
    }
  }

  // Signup Function
  async function signup() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    if(!email || !password) return alert("Email aur Password bharein!");

    const { data, error } = await _supabase.auth.signUp({ email, password });

    if (error) {
      alert("Error: " + error.message);
    } else {
      alert("Account ban gaya! Apne Email par verification link check karein.");
    }
  }
</script>

</body>
</html>
